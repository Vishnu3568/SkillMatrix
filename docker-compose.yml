version: '3.8'

services:
  # Database Service (MongoDB)
  mongodb:
    image: mongo:6.0
    container_name: skillmatrix-mongodb
    restart: unless-stopped
    ports:
      - '27017:27017'
    environment:
      MONGO_INITDB_DATABASE: skillmatrix
    volumes:
      - mongodb_data:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--eval", "db.adminCommand('ping')"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 5s

  # Backend Express API Service
  backend:
    build:
      context: ./server
      dockerfile: Dockerfile
    container_name: skillmatrix-backend
    restart: unless-stopped
    ports:
      - '5000:5000'
    environment:
      PORT: 5000
      NODE_ENV: production
      MONGODB_URI: mongodb://mongodb:27017/skillmatrix
      JWT_ACCESS_SECRET: docker_production_jwt_access_secret_key_min_32_chars_long
      JWT_REFRESH_SECRET: docker_production_jwt_refresh_secret_key_min_32_chars_long
      CLIENT_URL: http://localhost
      RATE_LIMIT_WINDOW: 900000
      RATE_LIMIT_MAX: 500
    volumes:
      - uploads_data:/app/public/uploads
    depends_on:
      mongodb:
        condition: service_healthy

  # Frontend Nginx React Service
  frontend:
    build:
      context: ./client
      dockerfile: Dockerfile
    container_name: skillmatrix-frontend
    restart: unless-stopped
    ports:
      - '80:80'
    depends_on:
      - backend

volumes:
  mongodb_data:
    driver: local
  uploads_data:
    driver: local
