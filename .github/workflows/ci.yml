name: SkillMatrix CI/CD Pipeline

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  lint-build-test:
    name: Lint, Build & Integration Tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Setup Node.js Environment
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install Workspace Dependencies
        run: npm install

      - name: Run ESLint Quality Check
        run: npm run lint

      - name: Build Client Production Bundle
        run: npm run build

      - name: Run Backend Integration Test Suite
        run: npm test
