name: SkillMatrix CI/CD Pipeline

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  lint-build-test:
    name: Lint, Build & Integration Tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Setup Node.js Environment
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install Workspace Dependencies
        run: |
          npm install
          npm install --no-save @rollup/rollup-linux-x64-gnu @esbuild/linux-x64

      - name: Run ESLint Quality Check
        run: npm run lint

      - name: Build Client Production Bundle
        run: npm run build

      - name: Run Backend Integration Test Suite
        env:
          NODE_ENV: test
          MONGODB_URI: mongodb://127.0.0.1:27017/skillmatrix_test
          JWT_ACCESS_SECRET: test_jwt_access_secret_key_min_32_chars_long
          JWT_REFRESH_SECRET: test_jwt_refresh_secret_key_min_32_chars_long
          CLIENT_URL: http://localhost:5173
        run: npm test
